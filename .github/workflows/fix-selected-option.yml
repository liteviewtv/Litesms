name: Fix selected option re-click
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor == 'liteviewtv'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch handlers
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/main.jsx')
          s=p.read_text()
          old='const countryButton=(x)=><button type="button" key={String(value(x))} className={`choice-chip ${countrySelected&&String(value(x))===String(country)?\'selected\':\'\'}`} onClick={()=>{setCountry(String(value(x)));setCountrySelected(true);setOperator(\'\');setOperatorSelected(false);setOperators([]);setOperatorsLoading(false);setProviderPrice(null);setRetailPrice(null);setPriceLoading(false);setSelectionReady(false);setServiceSearch(\'\')}}>{label(x)}</button>;'
          new='const countryButton=(x)=><button type="button" key={String(value(x))} className={`choice-chip ${countrySelected&&String(value(x))===String(country)?\'selected\':\'\'}`} onClick={()=>{const nextCountry=String(value(x));if(countrySelected&&nextCountry===String(country))return;setCountry(nextCountry);setCountrySelected(true);setOperator(\'\');setOperatorSelected(false);setOperators([]);setOperatorsLoading(true);setProviderPrice(null);setRetailPrice(null);setPriceLoading(false);setSelectionReady(false);setServiceSearch(\'\')}}>{label(x)}</button>;'
          if old not in s: raise SystemExit('country handler pattern not found')
          s=s.replace(old,new,1)
          old='const serviceButton=(x)=><button type="button" key={String(value(x))} className={`choice-chip ${serviceSelected&&String(value(x))===String(service)?\'selected\':\'\'}`} onClick={()=>{setService(String(value(x)));setServiceSelected(true);setOperator(\'\');setOperatorSelected(false);setOperators([]);setOperatorsLoading(false);setProviderPrice(null);setRetailPrice(null);setPriceLoading(false);setSelectionReady(false)}}>{label(x)}</button>;'
          new='const serviceButton=(x)=><button type="button" key={String(value(x))} className={`choice-chip ${serviceSelected&&String(value(x))===String(service)?\'selected\':\'\'}`} onClick={()=>{const nextService=String(value(x));if(serviceSelected&&nextService===String(service))return;setService(nextService);setServiceSelected(true);setOperator(\'\');setOperatorSelected(false);setOperators([]);setOperatorsLoading(true);setProviderPrice(null);setRetailPrice(null);setPriceLoading(false);setSelectionReady(false)}}>{label(x)}</button>;'
          if old not in s: raise SystemExit('service handler pattern not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/fix-selected-option.yml
          git add src/main.jsx .github/workflows/fix-selected-option.yml
          git commit -m "Fix re-clicking selected country and service" || exit 0
          git push
