name: Surgical SMS completion lifecycle fix
on:
  push:
    branches: [fix/sms-completion-lifecycle]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Apply SMS completion lifecycle fix') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply surgical frontend patch
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/main.jsx')
          s=p.read_text()
          s=s.replace(
            "const orderCheckLocks=useRef(new Set()),cancellationLocks=useRef(new Set());",
            "const orderCheckLocks=useRef(new Set()),cancellationLocks=useRef(new Set()),ordersRef=useRef([]);"
          )
          s=s.replace(
            " const loadData=async(id)=>{",
            " useEffect(()=>{ordersRef.current=orders},[orders]);\n const loadData=async(id)=>{",
            1
          )
          old=""" const checkOrder=async(orderId,silent=false)=>{if(!orderId||!profile||orderCheckLocks.current.has(orderId)||cancellationLocks.current.has(orderId))return;orderCheckLocks.current.add(orderId);setOrderChecking(v=>({...v,[orderId]:true]));try{const t=window.Telegram?.WebApp;const {data,error}=await supabase.functions.invoke('fivesim-order',{body:{initData:t?.initData,action:'check',order_id:orderId}});if(error||data?.error)throw new Error(data?.error||error?.message||'Unable to check order');if(data?.time_left!=null){const seconds=Number(data.time_left);if(Number.isFinite(seconds)&&seconds>=0)setOrderExpiry(v=>({...v,[orderId]:Date.now()+seconds*1000}))}if(data?.sms_code&&!silent)setMessage(`SMS code received: ${data.sms_code}`);setOrders(v=>v.map(o=>o.id===orderId?{...o,status:data?.status||o.status,sms_code:data?.sms_code||o.sms_code}:o));if(['cancelled','refunded','expired','failed','completed'].includes(String(data?.status||'').toLowerCase()))await loadData(profile.id)}catch(e){if(!silent)setMessage(e.message||'Unable to check order')}finally{orderCheckLocks.current.delete(orderId);setOrderChecking(v=>{const next={...v};delete next[orderId];return next})}};"""
          new=""" const checkOrder=async(orderId,silent=false)=>{if(!orderId||!profile||orderCheckLocks.current.has(orderId)||cancellationLocks.current.has(orderId))return;orderCheckLocks.current.add(orderId);setOrderChecking(v=>({...v,[orderId]:true}));try{const t=window.Telegram?.WebApp;const {data,error}=await supabase.functions.invoke('fivesim-order',{body:{initData:t?.initData,action:'check',order_id:orderId}});if(error||data?.error)throw new Error(data?.error||error?.message||'Unable to check order');const smsCode=String(data?.sms_code||'').trim();const effectiveStatus=smsCode?'completed':(data?.status||'');if(smsCode){setOrderExpiry(v=>{const next={...v};delete next[orderId];return next})}else if(data?.time_left!=null){const seconds=Number(data.time_left);if(Number.isFinite(seconds)&&seconds>=0)setOrderExpiry(v=>({...v,[orderId]:Date.now()+seconds*1000}))}if(smsCode&&!silent)setMessage(`SMS code received: ${smsCode}`);const current=ordersRef.current;const next=current.map(o=>o.id===orderId?{...o,status:effectiveStatus||o.status,sms_code:smsCode||o.sms_code}:o);ordersRef.current=next;setOrders(next);if(['cancelled','refunded','expired','failed','completed'].includes(String(effectiveStatus).toLowerCase())&&!smsCode)await loadData(profile.id)}catch(e){if(!silent)setMessage(e.message||'Unable to check order')}finally{orderCheckLocks.current.delete(orderId);setOrderChecking(v=>{const next={...v};delete next[orderId];return next})}};"""
          if old not in s: raise SystemExit('checkOrder target not found')
          s=s.replace(old,new,1)
          old=""" const cancelOrder=async(orderId)=>{if(!orderId||!profile||cancellationLocks.current.has(orderId))return false;cancellationLocks.current.add(orderId);setCancellingOrders(v=>({...v,[orderId]:true}));try{const t=window.Telegram?.WebApp;const {data,error}=await supabase.functions.invoke('fivesim-order',{body:{initData:t?.initData,action:'cancel',order_id:orderId}});if(error||data?.error)throw new Error(data?.error||error?.message||'Cancellation failed');if(!data?.success)throw new Error(data?.message||'Cancellation failed');setOrders(v=>v.map(o=>o.id===orderId?{...o,status:String(data?.status||'cancelled').toLowerCase()}:o));setMessage('Order cancelled and refund processed.');await loadData(profile.id);return true}catch(e){setMessage(e.message||'Cancellation failed');return false}finally{cancellationLocks.current.delete(orderId);setCancellingOrders(v=>{const next={...v};delete next[orderId];return next})}};"""
          new=""" const cancelOrder=async(orderId)=>{if(!orderId||!profile||cancellationLocks.current.has(orderId))return false;const latest=ordersRef.current.find(o=>o.id===orderId);if(String(latest?.sms_code||'').trim()||orderCheckLocks.current.has(orderId))return false;cancellationLocks.current.add(orderId);setCancellingOrders(v=>({...v,[orderId]:true}));try{const latestBeforeCancel=ordersRef.current.find(o=>o.id===orderId);if(String(latestBeforeCancel?.sms_code||'').trim()||orderCheckLocks.current.has(orderId))return false;const t=window.Telegram?.WebApp;const {data,error}=await supabase.functions.invoke('fivesim-order',{body:{initData:t?.initData,action:'cancel',order_id:orderId}});if(error||data?.error)throw new Error(data?.error||error?.message||'Cancellation failed');if(!data?.success)throw new Error(data?.message||'Cancellation failed');const next=ordersRef.current.map(o=>o.id===orderId?{...o,status:String(data?.status||'cancelled').toLowerCase()}:o);ordersRef.current=next;setOrders(next);setMessage('Order cancelled and refund processed.');await loadData(profile.id);return true}catch(e){setMessage(e.message||'Cancellation failed');return false}finally{cancellationLocks.current.delete(orderId);setCancellingOrders(v=>{const next={...v};delete next[orderId];return next})}};"""
          if old not in s: raise SystemExit('cancelOrder target not found')
          s=s.replace(old,new,1)
          old=""" useEffect(()=>{if(!profile||!orders.length)return;const active=orders.filter(o=>['pending','active'].includes(String(o.status).toLowerCase())&&o.provider_order_id&&!cancellationLocks.current.has(o.id));if(!active.length)return;active.forEach(o=>checkOrder(o.id,true));const timer=setInterval(()=>{active.forEach(o=>{if(!cancellationLocks.current.has(o.id))checkOrder(o.id,true)})},5000);return()=>clearInterval(timer)},[profile,orders]);"""
          new=""" useEffect(()=>{if(!profile||!orders.length)return;const active=orders.filter(o=>['pending','active'].includes(String(o.status).toLowerCase())&&!String(o.sms_code||'').trim()&&o.provider_order_id&&!cancellationLocks.current.has(o.id));if(!active.length)return;active.forEach(o=>checkOrder(o.id,true));const timer=setInterval(()=>{active.forEach(o=>{if(!cancellationLocks.current.has(o.id))checkOrder(o.id,true)})},5000);return()=>clearInterval(timer)},[profile,orders]);"""
          if old not in s: raise SystemExit('polling target not found')
          s=s.replace(old,new,1)
          old=""" useEffect(()=>{if(!profile||!orders.length)return;const now=Date.now();orders.forEach(o=>{const s=String(o.status||'').toLowerCase();const expiry=Number(orderExpiry[o.id]||0);if(!o.provider_order_id||!['pending','active'].includes(s)||!expiry||expiry>now||expirationCancels.has(o.id)||cancellationLocks.current.has(o.id))return;expirationCancels.add(o.id);cancelOrder(o.id).then(ok=>{if(!ok)expirationCancels.delete(o.id)}).catch(()=>expirationCancels.delete(o.id))});},[profile,orders,orderExpiry]);"""
          new=""" useEffect(()=>{if(!profile||!orders.length)return;const now=Date.now();orders.forEach(o=>{const s=String(o.status||'').toLowerCase();const hasSms=!!String(o.sms_code||'').trim();const expiry=Number(orderExpiry[o.id]||0);if(hasSms||!o.provider_order_id||!['pending','active'].includes(s)||!expiry||expiry>now||expirationCancels.has(o.id)||cancellationLocks.current.has(o.id)||orderCheckLocks.current.has(o.id))return;const latest=ordersRef.current.find(x=>x.id===o.id);if(String(latest?.sms_code||'').trim())return;expirationCancels.add(o.id);cancelOrder(o.id).then(ok=>{if(!ok)expirationCancels.delete(o.id)}).catch(()=>expirationCancels.delete(o.id))});},[profile,orders,orderExpiry]);"""
          if old not in s: raise SystemExit('expiration target not found')
          s=s.replace(old,new,1)
          old="""  const canCancel=(o)=>{const s=String(o.status||'').toLowerCase();const created=Date.parse(o.created_at||'');return ['pending','active'].includes(s)&&Number.isFinite(created)&&Date.now()-created>=120000};"""
          new="""  const canCancel=(o)=>{const s=String(o.status||'').toLowerCase();const hasSms=!!String(o.sms_code||'').trim();const created=Date.parse(o.created_at||'');return !hasSms&&!cancellingOrders[o.id]&&['pending','active'].includes(s)&&Number.isFinite(created)&&Date.now()-created>=120000};"""
          if old not in s: raise SystemExit('canCancel target not found')
          s=s.replace(old,new,1)
          old="""const s=String(o.status||'').toLowerCase();const completed=s==='completed';const phoneRaw"""
          new="""const s=String(o.status||'').toLowerCase();const code=o.sms_code==null?'':String(o.sms_code).trim();const hasSms=!!code;const completed=hasSms||s==='completed';const phoneRaw"""
          if old not in s: raise SystemExit('render status target not found')
          s=s.replace(old,new,1)
          old="""const code=o.sms_code==null?'':String(o.sms_code).trim();const hasSms=!!code;"""
          new=""""""
          if old not in s: raise SystemExit('duplicate code target not found')
          s=s.replace(old,new,1)
          p.write_text(s)
      - name: Remove temporary workflow and commit source-only change
        run: |
          rm -f .github/workflows/surgical-sms-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.jsx .github/workflows/surgical-sms-fix.yml
          git commit -m "Apply SMS completion lifecycle fix"
          git push
