name: Surgical SMS completion lifecycle fix
on:
  push:
    branches: [fix/sms-completion-lifecycle]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Apply SMS completion lifecycle fix') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply surgical frontend patch
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/main.jsx')
          s=p.read_text()
          s=s.replace("const orderCheckLocks=useRef(new Set()),cancellationLocks=useRef(new Set());","const orderCheckLocks=useRef(new Set()),cancellationLocks=useRef(new Set()),ordersRef=useRef([]);")
          s=s.replace(" const loadData=async(id)=>{"," useEffect(()=>{ordersRef.current=orders},[orders]);\n const loadData=async(id)=>{",1)
          s=s.replace("const effectiveStatus=data?.sms_code?'completed':(data?.status||'');","const effectiveStatus=data?.sms_code?'completed':(data?.status||'');")
          marker="const checkOrder=async(orderId,silent=false)=>{"
          start=s.index(marker)
          end=s.index(";\n const cancelOrder=",start)+2
          old=s[start:end]
          new="""const checkOrder=async(orderId,silent=false)=>{if(!orderId||!profile||orderCheckLocks.current.has(orderId)||cancellationLocks.current.has(orderId))return;orderCheckLocks.current.add(orderId);setOrderChecking(v=>({...v,[orderId]:true}));try{const t=window.Telegram?.WebApp;const {data,error}=await supabase.functions.invoke('fivesim-order',{body:{initData:t?.initData,action:'check',order_id:orderId}});if(error||data?.error)throw new Error(data?.error||error?.message||'Unable to check order');const smsCode=String(data?.sms_code||'').trim();const effectiveStatus=smsCode?'completed':(data?.status||'');if(smsCode){setOrderExpiry(v=>{const next={...v};delete next[orderId];return next})}else if(data?.time_left!=null){const seconds=Number(data.time_left);if(Number.isFinite(seconds)&&seconds>=0)setOrderExpiry(v=>({...v,[orderId]:Date.now()+seconds*1000}))}if(smsCode&&!silent)setMessage(`SMS code received: ${smsCode}`);const next=ordersRef.current.map(o=>o.id===orderId?{...o,status:effectiveStatus||o.status,sms_code:smsCode||o.sms_code}:o);ordersRef.current=next;setOrders(next);if(['cancelled','refunded','expired','failed','completed'].includes(String(effectiveStatus).toLowerCase())&&!smsCode)await loadData(profile.id)}catch(e){if(!silent)setMessage(e.message||'Unable to check order')}finally{orderCheckLocks.current.delete(orderId);setOrderChecking(v=>{const next={...v};delete next[orderId];return next})}}"""
          s=s[:start]+new+s[end:]
          s=s.replace("const s=String(o.status||'').toLowerCase();const completed=s==='completed';const phoneRaw","const s=String(o.status||'').toLowerCase();const code=o.sms_code==null?'':String(o.sms_code).trim();const hasSms=!!code;const completed=hasSms||s==='completed';const phoneRaw",1)
          s=s.replace("const code=o.sms_code==null?'':String(o.sms_code).trim();const hasSms=!!code;const countryRaw","const countryRaw",1)
          s=s.replace("{!completed&&countdown(o.id)&&","{!completed&&countdown(o.id)&&",1)
          s=s.replace("{canCancel(o)&&","{canCancel(o)&&",1)
          p.write_text(s)
      - name: Remove temporary workflow and commit source-only change
        run: |
          rm -f .github/workflows/surgical-sms-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.jsx .github/workflows/surgical-sms-fix.yml
          git commit -m "Apply SMS completion lifecycle fix"
          git push
