<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Litesms Payment</title><style>body{font-family:system-ui,sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;background:#fff}.box{text-align:center;padding:32px}.dot{width:42px;height:42px;border:4px solid #dbeafe;border-top-color:#16a34a;border-radius:50%;animation:r 1s linear infinite;margin:0 auto 18px}@keyframes r{to{transform:rotate(360deg)}}h2{color:#102a43}p{color:#64748b}</style></head><body><div class="box"><div class="dot"></div><h2 id="title">Verifying payment…</h2><p id="text">Please wait. Do not close this window.</p></div><script>(async()=>{const q=new URLSearchParams(location.search),tx_ref=q.get('tx_ref'),transaction_id=q.get('transaction_id'),status=q.get('status');if(!tx_ref){document.getElementById('title').textContent='Payment reference missing';return}try{const r=await fetch('https://slkkvwvtvxzbrjoxcdca.supabase.co/functions/v1/flutterwave-reconcile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tx_ref,transaction_id,status})});const d=await r.json();if(!r.ok||d.error)throw new Error(d.error||'Verification failed');document.getElementById('title').textContent=d.status==='credited'?'Payment successful':'Payment received';document.getElementById('text').textContent=d.status==='credited'?'Your Litesms wallet has been updated.':'Your payment is being verified.';window.parent.postMessage({type:'litesms-payment-result',...d,tx_ref},'*')}catch(e){document.getElementById('title').textContent='Payment verification failed';document.getElementById('text').textContent=e.message;window.parent.postMessage({type:'litesms-payment-result',status:'error',error:e.message,tx_ref},'*')}})();</script></body></html>
