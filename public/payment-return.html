<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Litesms Payment</title><style>body{font-family:system-ui,sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;background:#fff}.box{text-align:center;padding:32px}.dot{width:42px;height:42px;border:4px solid #dbeafe;border-top-color:#16a34a;border-radius:50%;animation:r 1s linear infinite;margin:0 auto 18px}@keyframes r{to{transform:rotate(360deg)}}h2{color:#102a43}p{color:#64748b}</style></head><body><div class="box"><div class="dot"></div><h2 id="title">Verifying payment…</h2><p id="text">Please wait. Do not close this window.</p></div><script>(async()=>{const q=new URLSearchParams(location.search),provider=q.get('provider'),tx_ref=q.get('tx_ref'),transaction_id=q.get('transaction_id'),status=q.get('status');const post=(data)=>{try{window.parent.postMessage(data,location.origin)}catch{}};const hideFrame=()=>{try{if(window.frameElement){window.frameElement.style.display='none';window.frameElement.style.height='0';window.frameElement.style.margin='0'}}catch{}};if(provider==='bachs'){const cancelled=q.get('cancelled')==='1'||status==='cancelled',checkout_id=q.get('checkout_id'),initData=window.parent?.Telegram?.WebApp?.initData||window.Telegram?.WebApp?.initData||'';if(cancelled){document.getElementById('title').textContent='Payment cancelled';document.getElementById('text').textContent='No money was added to your wallet.';post({type:'litesms-bachs-result',status:'cancelled',message:'Payment cancelled'});hideFrame();return}try{if(!checkout_id)throw new Error('Checkout reference missing');const r=await fetch('https://slkkvwvtvxzbrjoxcdca.supabase.co/functions/v1/bachs-reconcile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({checkout_id,tx_ref,initData})});const d=await r.json();if(!r.ok||d.error)throw new Error(d.error||'Verification failed');document.getElementById('title').textContent=d.status==='credited'?'Payment Confirmed':'Payment received';document.getElementById('text').textContent=d.status==='credited'?'Your Litesms wallet has been updated.':'Your payment is being verified.';post({type:'litesms-bachs-result',...d,tx_ref,checkout_id});hideFrame()}catch(e){document.getElementById('title').textContent='Payment received';document.getElementById('text').textContent='Your payment is being verified.';post({type:'litesms-bachs-result',status:'pending',message:'Payment received; checking verification…',tx_ref,checkout_id});hideFrame()}return}const initData=window.parent?.Telegram?.WebApp?.initData||window.Telegram?.WebApp?.initData||'';if(!tx_ref){document.getElementById('title').textContent='Payment reference missing';document.getElementById('text').textContent='You can return to Litesms.';post({type:'litesms-payment-result',status:'error',error:'Payment reference missing'});hideFrame();return}try{const r=await fetch('https://slkkvwvtvxzbrjoxcdca.supabase.co/functions/v1/flutterwave-reconcile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tx_ref,transaction_id,status,initData})});const d=await r.json();if(!r.ok||d.error)throw new Error(d.error||'Verification failed');document.getElementById('title').textContent=d.status==='credited'?'Payment Confirmed':d.status==='cancelled'?'Payment cancelled':'Payment received';document.getElementById('text').textContent=d.status==='credited'?'Your Litesms wallet has been updated.':d.status==='cancelled'?'The payment was cancelled.':'Your payment is being verified.';post({type:'litesms-payment-result',...d,tx_ref});hideFrame()}catch(e){document.getElementById('title').textContent='Payment verification failed';document.getElementById('text').textContent='Return to Litesms and check your wallet.';post({type:'litesms-payment-result',status:'error',error:e.message,tx_ref});hideFrame()}})();</script></body></html>
